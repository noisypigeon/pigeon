# An app-shape standalone's Worker, rendered by `instance.standup`, never by `pigeon cobot workers`;
# see .claude/decisions/2026-11-15-runtime-learner-practice-standalone-app.md, its 2026-11-15 amendment.
description: An app-only standalone instance's control Worker.
name: $deployment.worker
deployment: pigeon/platform
entry: { crate: src/pigeon-cli/crates/backplane, features: [worker] }
compatibility_date: "2026-10-01"
workers_dev: true
durable_objects:
  classes: [Instance]
  migrations:
    - { tag: v1, new_sqlite_classes: [Instance] }
bindings:
  r2:
    LEARNER: "$deployment.buckets[0].name"
  vars:
    INSTANCE_NAME: $deployment.instance
    SHAPE: app
    PASSKEY_RP_ID: platform.pigeon.dev
  version_metadata: CF_VERSION_METADATA
# STATE_KEY: 32 random bytes, hex, made in the stand-up job; HANDOVER: the owner's public keys.
secrets: [STATE_KEY, HANDOVER]
