description: Cloudflare capabilities a unit may request; minted per run, per 2026-11-04-development-platform-instance-separation.md.
capabilities:
  dns.write: { permissions: [DNS Write], scope: zone }
  zone.read: { permissions: [Zone Read], scope: zone }
  transform.write: { permissions: [Zone Transform Rules Write], scope: zone }
  redirects.write: { permissions: [Dynamic URL Redirects Write], scope: zone }
  r2.write: { permissions: [Workers R2 Storage Write], scope: account }
  artifacts.write: { permissions: [Artifacts Read, Artifacts Edit], scope: account }
  d1.write: { permissions: [D1 Write], scope: account }
  queues.write: { permissions: [Queues Write], scope: account }
  access.write: { permissions: ["Access: Apps and Policies Write", "Access: Service Tokens Write"], scope: account }
