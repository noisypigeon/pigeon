[workspace]
resolver = "3"
members = ["src/common", "src/pigeon-core", "src/pigeon-harness", "src/pigeon-agent", "src/pigeon-ios", "src/pigeon-site-templates", "src/pigeon-eviction"]


# What the checks need to know of this layout; see
# .claude/decisions/2026-11-16-development-src-crates-neutral-names.md's 2026-11-16 amendments.
[workspace.metadata.pigeon]
cli = "pigeon-harness"
policy-tests = ["pigeon-eviction", "pigeon-harness", "pigeon-agent"]
worker = { package = "pigeon-agent", name = "clippy agent worker (wasm)", only = ["src/pigeon-agent/src/worker/"] }
infra-tests = { package = "pigeon-agent", test = "suite", modules = ["infra_catalog::", "infra_manifest::", "sites_apex::", "git::", "infra_credentials::"] }

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "GPL-3.0-or-later"
repository = "https://github.com/noisypigeon/pigeon"
publish = false

[workspace.dependencies]
common = { path = "src/common", package = "pigeon-common" }
pigeon-core = { path = "src/pigeon-core" }
eviction = { path = "src/pigeon-eviction", package = "pigeon-eviction" }
agent = { path = "src/pigeon-agent", package = "pigeon-agent", default-features = false }
age = { version = "0.12.1", default-features = false }
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }
assert_cmd = "2.2.2"
jsonschema = { version = "0.59.0", default-features = false }
md-5 = "0.10.6"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = { version = "0.3.34", default-features = false }
hkdf = "0.12.4"
hmac = "0.12.1"
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa", "arithmetic"] }
include_dir = "0.7.4"
httparse = "1.10.1"
predicates = "3.1.4"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring", "pem"] }
regex = "1.13.1"
rusqlite = { version = "0.37.0", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.0.0"
serde_json = "1.0.154"
signal-hook = { version = "0.3.18", default-features = false }
sha1 = "0.10.6"
sha2 = "0.10.9"
tempfile = "3.27.0"
toml = "0.5.11"
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }
wasm-bindgen = "=0.2.130"
worker = { version = "0.8.7", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
