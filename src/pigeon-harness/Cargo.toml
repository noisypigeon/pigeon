[package]
name = "pigeon-harness"
description = "The pigeon command-line tool."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
autotests = false

[features]
default = ["eviction", "infra", "agent", "signing", "session"]
# One per command group; see .claude/decisions/2026-11-16-development-src-crates-neutral-names.md §3.
eviction = []
infra = ["dep:backplane", "backplane/engines", "dep:serde", "dep:serde_json"]
agent = ["infra", "session", "dep:backplane", "backplane/engines", "dep:serde", "dep:serde_json", "dep:signal-hook"]
# `pigeon signing` alone, for Buildkite's `macos-sign` agents; see
# .claude/decisions/2026-11-11-release-ios-app-buildkite-testflight.md §6.
signing = ["dep:backplane", "dep:serde_json", "dep:ureq"]
# `pigeon session`, for cloud agent sessions; see
# .claude/decisions/2026-11-13-development-rust-session-event-follower.md §2.
session = ["dep:backplane", "dep:serde_json", "dep:signal-hook", "dep:ureq"]
# The job images' `FEATURES` in worker.yaml, until it names `agent`; see the src-crates ADR §5.
backplane = ["agent", "dep:backplane"]

[dependencies]
backplane = { workspace = true, optional = true }
clap.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
signal-hook = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }

# The library and binary keep the name `pigeon`; the package is pigeon-harness (src-crates ADR step 7c).
[lib]
name = "pigeon"
path = "src/lib.rs"

[[bin]]
name = "pigeon"
path = "src/main.rs"

[[test]]
name = "suite"
path = "tests/suite/main.rs"

[dev-dependencies]
assert_cmd.workspace = true
serde_json.workspace = true
predicates.workspace = true
tempfile.workspace = true

[lints]
workspace = true
