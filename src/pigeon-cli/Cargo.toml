[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "GPL-3.0-or-later"
repository = "https://github.com/noisypigeon/pigeon"
publish = false

[workspace.dependencies]
sentinel = { path = "crates/sentinel" }
gantry = { path = "crates/gantry" }
cobot = { path = "crates/cobot" }
age = { version = "0.12.1", default-features = false }
assert_cmd = "2.2.2"
jsonschema = { version = "0.59.0", default-features = false }
clap = { version = "4.6.7", features = ["derive"] }
predicates = "3.1.4"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.0.0"
serde_json = "1.0.154"
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
