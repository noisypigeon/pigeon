[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "GPL-3.0-or-later"
repository = "https://github.com/noisypigeon/pigeon"
publish = false

[workspace.dependencies]
sentinel = { path = "crates/sentinel", package = "pigeon-sentinel" }
gantry = { path = "crates/gantry" }
cobot = { path = "crates/cobot", default-features = false }
backplane = { path = "crates/backplane", package = "pigeon-backplane", default-features = false }
age = { version = "0.12.1", default-features = false }
assert_cmd = "2.2.2"
jsonschema = { version = "0.59.0", default-features = false }
md-5 = "0.10.6"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = { version = "0.3.34", default-features = false }
hmac = "0.12.1"
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa", "arithmetic"] }
httparse = "1.10.1"
predicates = "3.1.4"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring", "pem"] }
regex = "1.13.1"
rusqlite = { version = "0.37.0", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.0.0"
serde_json = "1.0.154"
signal-hook = { version = "0.3.18", default-features = false }
sha1 = "0.10.6"
sha2 = "0.10.9"
tempfile = "3.27.0"
toml = "0.5.11"
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }
wasm-bindgen = "=0.2.130"
worker = { version = "0.8.7", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
