[package]
name = "pigeon-backplane"
description = "Composes pigeon's engines into one platform, serving one instance."
version = "0.1.30"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "backplane"
# A cdylib for `worker-build`; see .claude/decisions/2026-11-05-development-cobot-workers-area.md.
crate-type = ["cdylib", "rlib"]

[features]
default = ["engines"]
engines = [
  "dep:age",
  "dep:jsonschema",
  "dep:md-5",
  "dep:regex",
  "dep:toml",
  "dep:ureq",
  "dep:serde-saphyr",
  "dep:httparse",
  "dep:rustls",
]
worker = ["dep:futures-util", "dep:wasm-bindgen", "dep:worker", "worker/d1", "worker/queue"]

[dependencies]
age = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
hmac.workspace = true
jsonschema = { workspace = true, optional = true }
md-5 = { workspace = true, optional = true }
p256.workspace = true
regex = { workspace = true, optional = true }
serde.workspace = true
serde-saphyr = { workspace = true, optional = true }
sha1.workspace = true
sha2.workspace = true
serde_json.workspace = true
toml = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
httparse = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
worker = { workspace = true, optional = true }

[dev-dependencies]
rusqlite.workspace = true
rcgen.workspace = true
tempfile.workspace = true

[lints]
workspace = true
