[package]
name = "pigeon-backplane"
description = "Composes pigeon's engines into one platform, serving one instance."
version = "0.1.15"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "backplane"

[features]
default = ["engines"]
engines = [
  "dep:cobot",
  "cobot/engines",
  "dep:gantry",
  "dep:sentinel",
  "dep:serde-saphyr",
  "dep:sha2",
  "dep:hmac",
  "dep:httparse",
  "dep:rustls",
]
worker = ["dep:cobot", "cobot/worker"]

[dependencies]
cobot = { workspace = true, optional = true }
gantry = { workspace = true, optional = true }
sentinel = { workspace = true, optional = true }
serde.workspace = true
serde-saphyr = { workspace = true, optional = true }
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
httparse = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }

[dev-dependencies]
rcgen.workspace = true
tempfile.workspace = true

[lints]
workspace = true
