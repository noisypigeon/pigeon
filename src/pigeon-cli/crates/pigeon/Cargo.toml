[package]
name = "pigeon"
description = "The pigeon command-line tool."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["sentinel", "gantry"]
sentinel = ["dep:sentinel", "dep:serde", "dep:serde_json"]
gantry = ["dep:gantry"]

[dependencies]
clap.workspace = true
gantry = { workspace = true, optional = true }
sentinel = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true

[lints]
workspace = true
