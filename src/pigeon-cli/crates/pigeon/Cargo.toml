[package]
name = "pigeon"
description = "The pigeon command-line tool."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["sentinel", "gantry", "cobot"]
sentinel = ["dep:sentinel"]
gantry = ["dep:gantry"]
cobot = ["dep:cobot", "dep:serde", "dep:serde_json"]

[dependencies]
clap.workspace = true
cobot = { workspace = true, optional = true }
gantry = { workspace = true, optional = true }
sentinel = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
assert_cmd.workspace = true
serde_json.workspace = true
predicates.workspace = true
tempfile.workspace = true

[lints]
workspace = true
