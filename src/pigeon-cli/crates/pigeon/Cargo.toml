[package]
name = "pigeon"
description = "The pigeon command-line tool."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["sentinel", "cobot", "backplane", "signing"]
sentinel = []
cobot = ["dep:backplane", "backplane/engines", "dep:serde", "dep:serde_json"]
backplane = ["cobot", "dep:backplane", "backplane/engines", "dep:serde", "dep:serde_json", "dep:signal-hook"]
# `pigeon backplane signing` alone, for Buildkite's `macos-sign` agents; see
# .claude/decisions/2026-11-11-release-ios-app-buildkite-testflight.md §6.
signing = ["dep:backplane", "dep:serde_json", "dep:ureq"]

[dependencies]
backplane = { workspace = true, optional = true }
clap.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
signal-hook = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }

[dev-dependencies]
assert_cmd.workspace = true
serde_json.workspace = true
predicates.workspace = true
tempfile.workspace = true

[lints]
workspace = true
