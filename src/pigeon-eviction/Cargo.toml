[package]
name = "pigeon-eviction"
description = "A policy engine that checks a repository against YAML policies."
version = "0.1.18"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
autotests = false

[lib]
name = "eviction"

[[bin]]
# The stored build keeps its name until the restructure ADR's step 12.
name = "pigeon-sentinel"
path = "src/main.rs"

[dependencies]
regex.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true

[[test]]
name = "suite"
path = "tests/suite/main.rs"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
