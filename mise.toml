# See .claude/decisions/2026-11-02-development-cargo-workspace-mise-toolchain.md.
min_version = "2026.10.12"

[tools]
rust = { version = "1.99.1", profile = "minimal", components = "clippy,rustfmt" }

[tasks.build]
dir = "src/pigeon-cli"
run = "cargo build --workspace --locked"

[tasks.test]
dir = "src/pigeon-cli"
run = "cargo test --workspace --locked"

[tasks.fmt]
dir = "src/pigeon-cli"
run = "cargo fmt --all"

[tasks.fmt-check]
dir = "src/pigeon-cli"
run = "cargo fmt --all -- --check"

[tasks.lint]
dir = "src/pigeon-cli"
run = "cargo clippy --workspace --all-targets --locked -- -D warnings"

[tasks.rust]
depends = ["fmt-check", "lint", "test"]

[tasks.sentinel]
dir = "src/pigeon-cli"
run = "cargo run -q --locked -p pigeon -- sentinel check --root ../.."

[tasks.sentinel-pr]
dir = "src/pigeon-cli"
run = "cargo run -q --locked -p pigeon -- sentinel check --root ../.. --pull-request"

[tasks.ci]
depends = ["rust", "sentinel"]
