# pigeon as an instance: its units by kind; see .claude/decisions/2026-11-05-runtime-instance-config-kind-units.md.
schema: v1
name: pigeon
description: The pigeon platform, as its own instance.
repository: https://github.com/noisypigeon/pigeon
units:
  repos/pigeon:
    kind: cloudflare/git-repo
    mirror: https://github.com/noisypigeon/pigeon
  # pigeon's own zone; its ID is looked up, never written.
  zones/pigeon.dev:
    kind: cloudflare/zone
    services: {}
    records: {}
  # The architecture site, built from architecture.describe; see
  # .claude/decisions/2026-11-05-runtime-architecture-site-through-backplane.md.
  sites/docs:
    kind: cloudflare/static-site
    zone: pigeon.dev
    hosts: []
    served_by: { unit: platform/blue, path: /docs }
    template: { name: architecture, version: tree }
    site:
      title: pigeon
      description: The pigeon platform's architecture, drawn from its own configuration.
  platform/blue:
    kind: pigeon/platform
    worker: pigeon-control
    hostname: pigeon-control.pigeon-dev.workers.dev
    domains: [platform.pigeon.dev, blue.platform.pigeon.dev]
    instance: pigeon
    change_floor: 12
    database: { name: pigeon }
    buckets: [ { name: pigeon-state }, { name: pigeon-plans }, { name: pigeon-ci } ]
    queue: { name: pigeon-ci-events }
    access: { application: "pigeon-control - Cloudflare Workers", owners_policy: Cloudflare account members }
    service_tokens:
      - { name: pigeon-agent, policy: agent, secret_version: 2, previous_secret_expires: "2026-11-06T02:37:43Z" }
      - { name: pigeon-deployer, policy: pigeon-deployer, secret_version: 1, previous_secret_expires: "2026-11-07T03:09:37Z" }
      - { name: pigeon-builds, policy: pigeon-builds, secret_version: 2, previous_secret_expires: "2026-11-08T04:20:01Z" }
    # Reached without an Access login; the route authenticates its caller itself. See
    # .claude/decisions/2026-11-11-release-ios-app-buildkite-testflight.md §5.
    public_paths:
      - { name: pigeon-control apple release, paths: [platform.pigeon.dev/v0/apple/release, blue.platform.pigeon.dev/v0/apple/release] }
