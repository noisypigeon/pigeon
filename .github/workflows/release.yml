# The release bot; see .claude/decisions/2026-11-02-release-crate-units-and-images.md
# and .claude/decisions/2026-11-03-release-cobot-image-in-workflows.md.
name: release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.BOT_GITHUB_TOKEN }}
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.12
      - run: |
          set -euo pipefail
          git config user.name istx25
          git config user.email 6799989+istx25@users.noreply.github.com
          for attempt in 1 2 3; do
            git fetch -q --tags origin main
            git reset -q --hard origin/main
            git clean -fdq
            out=$(cd src/pigeon-cli && cargo run -q --locked -p pigeon -- cobot release --root ../..)
            echo "$out"
            (cd src/pigeon-cli && cargo update -w --offline)
            mapfile -t written < <(jq -r '.written[]' <<<"$out")
            git add -- "${written[@]}" src/pigeon-cli/Cargo.lock
            if git diff --cached --quiet; then exit 0; fi
            title=$(jq -r '[.released[] | "\(.unit) v\(.version)"] | join(", ") | if . == "" then "changelogs" else . end' <<<"$out")
            git commit -q -m "chore(release): $title"
            mapfile -t tags < <(jq -r '.released[].tag' <<<"$out")
            for tag in "${tags[@]}"; do git tag "$tag"; done
            if git push --atomic origin HEAD:main "${tags[@]}"; then exit 0; fi
            for tag in "${tags[@]}"; do git tag -d "$tag"; done
            echo "push rejected; retrying from the new main ($attempt/3)"
          done
          exit 1

  pending:
    needs: release
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/noisypigeon/pigeon-cobot:latest
    outputs:
      units: ${{ steps.pending.outputs.units }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Log in to GHCR
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - id: pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          all=$(docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo "$IMAGE" cobot tags --root /repo)
          pending='[]'
          while read -r row; do
            tag=$(jq -r '.tag' <<<"$row")
            if ! gh release view "$tag" >/dev/null 2>&1; then
              pending=$(jq -c --argjson r "$row" '. + [$r]' <<<"$pending")
            fi
          done < <(jq -c '.[]' <<<"$all")
          echo "$pending"
          echo "units=$pending" >>"$GITHUB_OUTPUT"

  image:
    needs: pending
    if: ${{ always() && !cancelled() && needs.pending.outputs.units != '' && needs.pending.outputs.units != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.pending.outputs.units) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ matrix.tag }}
          persist-credentials: false
      - env:
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ matrix.version }}
          FEATURES: ${{ matrix.features }}
          CHANGELOG: ${{ matrix.changelog }}
          CHANGELOG_FROM: ${{ matrix.changelog_from }}
          TAG: ${{ matrix.tag }}
          NEWEST: ${{ matrix.newest }}
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          if [ -n "$IMAGE" ]; then
            echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
            docker build --target "$FEATURES" --build-arg FEATURES="$FEATURES" -t "$IMAGE:$VERSION" src/pigeon-cli
            docker run --rm "$IMAGE:$VERSION" "$FEATURES" --version
            docker push "$IMAGE:$VERSION"
            if [ "$NEWEST" = true ]; then
              docker tag "$IMAGE:$VERSION" "$IMAGE:latest"
              docker push "$IMAGE:latest"
            fi
          fi
          notes="$RUNNER_TEMP/notes.md"
          for file in "$CHANGELOG" "$CHANGELOG_FROM"; do
            if [ -n "$file" ] && [ "$file" != null ] && [ -f "$file" ]; then
              awk -v h="## v$VERSION " 'index($0, h) == 1 { on = 1; next } on && /^## / { exit } on && NF' \
                "$file" >"$notes"
              break
            fi
          done
          [ -s "$notes" ] || echo "Release $TAG" >"$notes"
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$notes" --latest="$NEWEST"
