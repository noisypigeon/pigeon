# Runs the released pigeon-sentinel and pigeon-backplane images; see .claude/decisions/2026-11-02-release-crate-units-and-images.md and .claude/decisions/2026-11-03-development-backplane-platform-composition-layer.md.
name: lifecycle

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

env:
  IMAGE: ghcr.io/noisypigeon/pigeon-sentinel:latest

jobs:
  sentinel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
      - run: docker run --rm -v "$PWD:/repo:ro" "$IMAGE" sentinel check --root /repo

  backplane:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/noisypigeon/pigeon-backplane:latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
      - run: docker run --rm -v "$PWD:/repo:ro" "$IMAGE" backplane instance --root /repo

  sentinel-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: |
          {
            echo 'PR_FILES<<EOF'
            git diff --name-only "$BASE...$HEAD"
            echo 'EOF'
          } >>"$GITHUB_ENV"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
      - run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
      - run: >-
          docker run --rm -v "$PWD:/repo:ro"
          -e PR_TITLE -e PR_BODY -e PR_NUMBER -e PR_FILES
          "$IMAGE" sentinel check --root /repo --pull-request
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
