# Plan on PR, apply on merge and daily; see .claude/decisions/2026-11-02-runtime-cobot-infrastructure-as-code.md
# and .claude/decisions/2026-11-02-runtime-cloudflare-provisioner-unit.md.
name: cobot

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

env:
  STATE_REPO: noisypigeon/pigeon-cobot-state

jobs:
  plan:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out main, for the trusted binary
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          persist-credentials: false
      - name: Check out the state repository, read-only
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ env.STATE_REPO }}
          token: ${{ secrets.BOT_GITHUB_TOKEN }}
          path: .state
          persist-credentials: false
      - name: Check out the PR, as data
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .pr
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.12
      - name: Build pigeon from main
        run: cargo build -q --locked -p pigeon --no-default-features --features cobot --manifest-path src/pigeon-cli/Cargo.toml
      - name: Refuse provider changes
        id: providers
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          changed=false
          for f in providers.yaml providers.lock.hcl; do
            if [ -e ".config/$f" ] || [ -e ".pr/.config/$f" ]; then
              cmp -s ".config/$f" ".pr/.config/$f" 2>/dev/null || changed=true
            fi
          done
          echo "changed=$changed" >>"$GITHUB_OUTPUT"
          [ "$changed" = true ] || exit 0
          msg="Provider changes are planned after they merge; land them in their own PR first."
          printf '<!-- cobot-plan -->\n%s\n' "$msg" >"$RUNNER_TEMP/summary.md"
          cat "$RUNNER_TEMP/summary.md" >>"$GITHUB_STEP_SUMMARY"
          units=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' | grep -E '^(infra|workloads)/' || true)
          if [ -n "$units" ]; then
            echo "::error::$msg"
            exit 1
          fi
      - name: Validate
        if: steps.providers.outputs.changed != 'true'
        run: src/pigeon-cli/target/debug/pigeon cobot validate --root .pr
      - name: Plan
        if: steps.providers.outputs.changed != 'true'
        env:
          COBOT_STATE_PASSPHRASE: ${{ secrets.COBOT_STATE_PASSPHRASE }}
          COBOT_SECRETS_PASSPHRASE: ${{ secrets.COBOT_SECRETS_PASSPHRASE }}
        run: |
          src/pigeon-cli/target/debug/pigeon cobot plan --root .pr --state .state --summary "$RUNNER_TEMP/summary.md"
          cat "$RUNNER_TEMP/summary.md" >>"$GITHUB_STEP_SUMMARY"
      - name: Comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- cobot-plan -->")) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@"$RUNNER_TEMP/summary.md" >/dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -F body=@"$RUNNER_TEMP/summary.md" >/dev/null
          fi

  apply:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    concurrency:
      group: cobot-apply
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Check out the state repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ env.STATE_REPO }}
          token: ${{ secrets.BOT_GITHUB_TOKEN }}
          path: .state
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.12
      - name: Build pigeon
        run: cargo build -q --locked -p pigeon --no-default-features --features cobot --manifest-path src/pigeon-cli/Cargo.toml
      - name: Apply
        id: apply
        env:
          COBOT_STATE_PASSPHRASE: ${{ secrets.COBOT_STATE_PASSPHRASE }}
          COBOT_SECRETS_PASSPHRASE: ${{ secrets.COBOT_SECRETS_PASSPHRASE }}
        run: |
          set -o pipefail
          src/pigeon-cli/target/debug/pigeon cobot apply --root . --state .state | tee "$RUNNER_TEMP/apply.md"
          cat "$RUNNER_TEMP/apply.md" >>"$GITHUB_STEP_SUMMARY"
      - name: Commit state, even after a failed apply
        if: ${{ !cancelled() && steps.apply.outcome != 'skipped' }}
        env:
          SHA: ${{ github.sha }}
          OUTCOME: ${{ steps.apply.outcome }}
        run: |
          set -euo pipefail
          cd .state
          git add -A
          if git diff --cached --quiet; then
            echo "no state changes"
            exit 0
          fi
          units=$(git diff --cached --name-only | xargs -n1 dirname | sort -u | paste -sd, -)
          git config user.name istx25
          git config user.email 6799989+istx25@users.noreply.github.com
          suffix=""
          if [ "$OUTCOME" != success ]; then suffix=" (apply failed; partial)"; fi
          git commit -q -m "cobot: apply $units from noisypigeon/pigeon@$SHA$suffix"
          git push origin HEAD
