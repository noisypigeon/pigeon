# See .claude/decisions/2026-11-02-development-cargo-workspace-mise-toolchain.md.
name: rust

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.changes.outputs.rust }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          files="$RUNNER_TEMP/files.txt"
          if [ -n "$PR" ]; then
            gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' >"$files"
          elif [ -z "${BEFORE//0/}" ]; then
            echo "rust=true" >>"$GITHUB_OUTPUT"
            exit 0
          else
            git diff --name-only "$BEFORE" "$AFTER" >"$files"
          fi
          rust=false
          if awk '(/^src\/pigeon-cli\// && !/\.md$/) || /^mise\.toml$/ || /^\.github\/workflows\/rust\.yml$/ { f = 1 } END { exit !f }' "$files"; then
            rust=true
          fi
          echo "rust=$rust" >>"$GITHUB_OUTPUT"

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.12
      - run: mise run rust

  image:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: [sentinel, gantry, cobot]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: docker build --target "$FEATURES" --build-arg FEATURES="$FEATURES" -t "pigeon-$FEATURES:ci" src/pigeon-cli
        env:
          FEATURES: ${{ matrix.features }}
      - run: docker run --rm "pigeon-$FEATURES:ci" "$FEATURES" --version
        env:
          FEATURES: ${{ matrix.features }}
