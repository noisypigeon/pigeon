# Build static sites on PR, with no secrets; see .claude/decisions/2026-11-03-runtime-cloudflare-static-sites-r2.md
# and .claude/decisions/2026-11-03-release-cobot-image-in-workflows.md.
name: sites

on:
  pull_request:
    paths:
      - "workloads/**/site/**"
      - "workloads/**/config.yaml"
      - "src/site-templates/**"

permissions:
  contents: read
  packages: read

env:
  IMAGE: ghcr.io/noisypigeon/pigeon-cobot:latest

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Log in to GHCR
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Build the sites
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo "$IMAGE" cobot sites build --root /repo
