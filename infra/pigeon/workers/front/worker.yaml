# pigeon-front: forwards each request to the color the lease names; see
# .claude/decisions/2026-11-18-runtime-independent-blue-green-workers.md, its step 9a amendment.
description: Forwards each request to the color the lease names.
name: pigeon-front
deployment: pigeon/platform
entry: { crate: src/pigeon-front, features: [worker] }
compatibility_date: "2026-10-01"
workers_dev: false
# No route while pigeon-control holds its test host, the step 9b rehearsal's part one.
routes: []
# Checked through that host, which reaches the primary.
forwards: $deployment.domains[2]
bindings:
  d1: { DB: { name: $deployment.database.name, id: $deployment.database_id } }
  services: { PIGEON_CONTROL: pigeon-control }
