# The platform's control plane; see .claude/decisions/2026-11-05-runtime-control-plane-worker.md
# and .claude/decisions/2026-11-05-development-changes-through-pigeon-mcp.md.
description: pigeon's control plane, its MCP server, and CI for changes.
name: $deployment.worker
# The stack it serves, by unit; see .claude/decisions/2026-11-08-runtime-blue-green-self-standup.md.
deployment: pigeon/platform
entry: { crate: src/pigeon-cli/crates/backplane, features: [worker] }
compatibility_date: "2026-10-01"
# Served only at its domains below; see
# .claude/decisions/2026-11-10-runtime-platform-hostname-dashboard-observability.md §1.
workers_dev: false
# The platform's hostname and the stack's own, which Access covers.
routes:
  - custom_domain: $deployment.domains[0]
  - custom_domain: $deployment.domains[1]
durable_objects:
  classes: [Instance, ChangeRun, Checker, Runner, MainRun]
  migrations:
    - { tag: v1, new_sqlite_classes: [Instance, ChangeRun, Checker] }
    - { tag: v2, new_sqlite_classes: [MainRun] }
    - { tag: v3, new_sqlite_classes: [Runner] }
# Checks run on Checker, the bound job, merges and deploys on Runner; see
# .claude/decisions/2026-11-06-development-control-plane-approvals-images-state.md §4.
containers:
  - class: Checker
    image: { dockerfile: src/pigeon-cli/Dockerfile, target: ci, args: { FEATURES: backplane } }
    instance_type: standard-4
    max_instances: 12
  - class: Runner
    image: { dockerfile: src/pigeon-cli/Dockerfile, target: ci, args: { FEATURES: backplane } }
    instance_type: standard-1
    max_instances: 8
bindings:
  d1:
    DB: { name: $deployment.database.name, id: $deployment.database_id, migrations: src/pigeon-cli/crates/backplane/migrations }
  r2:
    CI_LOGS: "$deployment.bucket_names[pigeon-ci]"
    # The architecture site, served at /docs/; see
    # .claude/decisions/2026-11-11-runtime-docs-under-platform-passkey.md §3.
    DOCS: "$output.sites/docs.bucket"
  queues:
    consumers: [ { queue: $deployment.queue.name, max_batch_size: 10 } ]
  vars:
    INSTANCE_NAME: $deployment.instance
    NAMESPACE: pigeon
    REPO: pigeon
    # change/1 to change/11 were pushed by hand, before the control plane numbered changes.
    CHANGE_FLOOR: $deployment.change_floor
    # Where the deploy job asks /healthz: the stack's own hostname.
    PUBLIC_HOST: $deployment.domains[1]
    # Passkeys' relying party, the platform's hostname; see
    # .claude/decisions/2026-11-10-runtime-platform-hostname-dashboard-observability.md §2.
    PASSKEY_RP_ID: $deployment.domains[0]
    # The GitHub mirror MainRun pushes to; see .claude/decisions/2026-11-08-development-github-mirror-on-merge.md.
    MIRROR: https://github.com/noisypigeon/pigeon
    # The merges' author, the owner's GitHub noreply address; see the 2026-11-10 amendment of
    # .claude/decisions/2026-11-05-development-changes-through-pigeon-mcp.md.
    COMMIT_AUTHOR: "noisypigeon <167243387+noisypigeon@users.noreply.github.com>"
  version_metadata: CF_VERSION_METADATA
# DEPLOY_TOKEN: an account token with Workers R2 Storage Edit and Zone Read, for publishing sites.
# SESSION_KEY: 32 random bytes, hex; signs MCP session IDs.
# APPROVER_TOTP: the owner's authenticator secret, base32, from `pigeon backplane totp-secret`.
# APPROVER: the owner's email, recorded on approvals made in the card.
# The deploy job's alone, per .claude/decisions/2026-11-07-development-control-plane-deploys-itself.md:
# WORKERS_DEPLOY_TOKEN: an account token with `pigeon cobot workers permissions`;
# DEPLOY_OUTPUTS: `pigeon cobot workers outputs`; DEPLOY_IMAGES: `pigeon cobot workers images push`;
# DEPLOYER_ACCESS_ID, DEPLOYER_ACCESS_SECRET: an Access service token, for /healthz only.
# BUILDS_ACCESS_ID, BUILDS_ACCESS_SECRET: an Access service token job Containers download main's
# pigeon with, for /builds/ only; see .claude/decisions/2026-11-07-development-job-images-on-cloudflare.md.
# GITHUB_APP_ID, GITHUB_APP_KEY: the mirror's GitHub App and its PKCS#8 key; until set, the
# mirror fails and the digest names it, per .claude/decisions/2026-11-08-development-github-mirror-on-merge.md §3.
# PUSH_VAPID_KEY: the Web Push key, from `pigeon backplane vapid-key`; optional, see
# .claude/decisions/2026-11-08-development-events-tickets-digest-mandate.md §3.
# PLATFORM_STATE_KEY: 32 random bytes, hex; platform runs' state passphrase, the platform's
# alone; see .claude/decisions/2026-11-08-runtime-blue-green-self-standup.md, step 4's amendment.
# APPLE_ASC_KEY, APPLE_ASC_KEY_ID, APPLE_ASC_ISSUER, APPLE_TEAM_ID, APPLE_DIST_P12,
# APPLE_DIST_P12_PASSWORD, BUILDKITE_TOKEN: the Apple connection and the signing pipeline; see
# .claude/decisions/2026-11-11-release-ios-app-buildkite-testflight.md §5.
# BITRISE_TOKEN, BITRISE_APP_SLUG: the macOS failover's Bitrise app; see
# .claude/decisions/2026-11-12-development-macos-builds-provider-failover.md §4.
secrets: [BACKPLANE_TOKEN, ARTIFACTS_TOKEN, ACCESS_TEAM, ACCESS_AUD, DEPLOY_TOKEN, SESSION_KEY, APPROVER_TOTP, APPROVER, WORKERS_DEPLOY_TOKEN, DEPLOY_OUTPUTS, DEPLOY_IMAGES, DEPLOYER_ACCESS_ID, DEPLOYER_ACCESS_SECRET, BUILDS_ACCESS_ID, BUILDS_ACCESS_SECRET, PUSH_VAPID_KEY, PLATFORM_STATE_KEY, GITHUB_APP_ID, GITHUB_APP_KEY, APPLE_ASC_KEY, APPLE_ASC_KEY_ID, APPLE_ASC_ISSUER, APPLE_TEAM_ID, APPLE_DIST_P12, APPLE_DIST_P12_PASSWORD, BUILDKITE_TOKEN, APNS_KEY, APNS_KEY_ID, BITRISE_TOKEN, BITRISE_APP_SLUG]
# The owner's hourly digest.
crons: ["17 * * * *"]
