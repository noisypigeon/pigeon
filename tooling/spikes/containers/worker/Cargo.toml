# The spike's Worker; see .claude/decisions/2026-11-04-development-platform-instance-separation.md (phase 3 amendment).
[package]
name = "pigeon-spike-worker"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1.0.154"
wasm-bindgen = "=0.2.130"
worker = { version = "0.8.7", features = ["d1"] }

[profile.release]
opt-level = "s"
lto = true
