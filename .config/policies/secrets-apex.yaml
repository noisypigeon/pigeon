description: The noisypigeon.com apex keeps exactly its two encrypted secrets, per 2026-11-04-development-platform-instance-separation.md.
target: { file: workloads/noisypigeon.com/apex/secrets.config.yaml }
rules:
  - fields:
      after: 0
      pattern: '^(?<key>[a-z0-9_]+): (?<value>.*)$'
      only: true
      expect:
        - { key: pm_verification, nonempty: true }
        - { key: protonmail_verification, nonempty: true }
  - line: { at: 1, matches: '^[a-z0-9_]+: ENC\[cobot:v1:[A-Za-z0-9+/=]+\]$' }
  - line: { at: 2, matches: '^[a-z0-9_]+: ENC\[cobot:v1:[A-Za-z0-9+/=]+\]$' }
