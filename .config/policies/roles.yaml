description: Each level's permissions are a comment, then exactly three explicit lists, with no wildcard; standard holds no permission and service at most read and propose, per 2026-11-18-security-users-levels-capability-grants.md §2.
target:
  files: [.config/roles.yaml]
  optional: true
rules:
  - line: { at: 1, matches: '^# ' }
  - line: { at: 2, matches: '^roles:$' }
  - line: { at: 3, matches: '^  administrator: \[read, propose, approve, approve\.owner, auto, mandates, platform, members(, learner)?\]$' }
  - line: { at: 4, matches: '^  (user|standard): \[(learner)?\]$' }
  - fields:
      after: 4
      pattern: '^  (?<key>[a-z]+): (?<value>\[.*\])$'
      only: true
      expect:
        - { key: service, matches: '^\[(read(, propose)?|propose)?\]$' }
