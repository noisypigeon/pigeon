description: Terraform modules live only in catalog/, infra/ and workloads/; units, variables, lock files and encrypted secrets only in infra/ and workloads/; state never in this repository.
target: tree
rules:
  - find:
      match: '(\.tf|\.tf\.json|\.tofu|\.tofu\.json)$'
      allow_under: [catalog/, infra/, workloads/]
      ignore: ['^\.git$', '(^|/)target$', '(^|/)\.pigeon$']
  - find:
      match: '(\.tfvars|\.tfvars\.json|(^|/)\.terraform\.lock\.hcl|(^|/)unit\.yaml)$'
      allow_under: [infra/, workloads/]
      ignore: ['^\.git$', '(^|/)target$', '(^|/)\.pigeon$']
  - find:
      match: '(\.tfstate(\.backup)?$|(^|/)\.terraform/)'
      ignore: ['^\.git$', '(^|/)target$', '(^|/)\.pigeon$']
  - find:
      match: '(^|/)secrets\.config\.yaml$'
      allow_under: [infra/, workloads/]
      ignore: ['^\.git$', '(^|/)target$', '(^|/)\.pigeon$']
examples:
  pass:
    - files:
        infra/a/unit.yaml: ''
        infra/a/modules/m/main.tf: ''
        catalog/c/modules/m/main.tf: ''
        workloads/w/unit.yaml: ''
        src/x/target/debug/build.tf: ''
        .pigeon/infra/a/main.tf.json: ''
  fail:
    - files: { src/pigeon-cli/main.tf: '' }
    - files: { tooling/x.tf.json: '' }
    - files: { x.tofu: '' }
    - files: { src/vars.tfvars: '' }
    - files: { .terraform.lock.hcl: '' }
    - files: { src/unit.yaml: '' }
    - files: { catalog/c/unit.yaml: '' }
    - files: { catalog/c/vars.tfvars: '' }
    - files: { catalog/c/.terraform.lock.hcl: '' }
    - files: { catalog/c/secrets.config.yaml: '' }
    - files: { infra/a/terraform.tfstate: '' }
    - files: { workloads/w/terraform.tfstate.backup: '' }
    - files: { infra/a/.terraform/providers/x: '' }
