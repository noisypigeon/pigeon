description: Generated dated changelogs have dated sections, newest first, one linked line per change.
target:
  files: [CHANGELOG.md, src/pigeon-cli/CHANGELOG.md, src/pigeon-cli/crates/pigeon/CHANGELOG.md]
  optional: true
rules:
  - line:
      at: 1
      matches: '^# Changelog$'
  - headings:
      level: 2
      each: '^(?<day>[0-9]{4}-[0-9]{2}-[0-9]{2})$'
      min: 1
      order: { by: day, direction: descending, strict: true }
  - items:
      under: { level: 2 }
      lines: true
      matches: '^- .*\S \((?:\[#(?<pr>[0-9]+)\]\(https://github\.com/noisypigeon/pigeon/pull/(?<pr_url>[0-9]+)\)|\[(?<sha>[0-9a-f]{7,40})\]\(https://github\.com/noisypigeon/pigeon/commit/(?<sha_url>[0-9a-f]{40})\))\)$'
      min: 1
      elsewhere: forbid
      equal: [pr, pr_url]
      prefix: [sha, sha_url]
      unique: pr
