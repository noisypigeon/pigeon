description: The one CHANGELOG.md the release bot renders from history; days newest first, each with its releases and merged lines. See .claude/decisions/2026-11-16-development-src-crates-neutral-names.md §7.
target:
  files: [CHANGELOG.md]
  optional: true
rules:
  - line:
      at: 1
      matches: '^# Changelog$'
  - headings:
      level: 2
      each: '^(?<day>[0-9]{4}-[0-9]{2}-[0-9]{2})$'
      min: 1
      order: { by: day, direction: descending, strict: true }
  - headings:
      level: 3
      each: '^(Released|Merged)$'
  - items:
      under: { level: 2 }
      lines: true
      matches: '^(Released|Merged|- \S.*)$'
      min: 1
      elsewhere: forbid
  - items:
      under: { level: 3, text: Released }
      lines: true
      matches: '^- [a-z0-9][a-z0-9-]* v[0-9]+\.[0-9]+\.[0-9]+$'
      min: 1
  - items:
      under: { level: 3, text: Merged }
      lines: true
      matches: '^- (?:units renamed · [a-z0-9-]+ → [a-z0-9-]+(?:, [a-z0-9-]+ → [a-z0-9-]+)*|.*\S \((?:\[#(?<pr>[0-9]+)\]\(https://github\.com/noisypigeon/pigeon/pull/(?<pr_url>[0-9]+)\)|\[(?<sha>[0-9a-f]{7,40})\]\(https://github\.com/noisypigeon/pigeon/commit/(?<sha_url>[0-9a-f]{40})\))\)(?: · [a-z0-9-]+(?:, [a-z0-9-]+)*)?)$'
      min: 1
      equal: [pr, pr_url]
      prefix: [sha, sha_url]
      unique: pr
examples:
  pass:
    - files: { CHANGELOG.md: "# Changelog\n\n## 2026-01-03\n\n### Released\n\n- a v0.1.1\n- b v0.2.0\n\n### Merged\n\n- feat: first ([#1](https://github.com/noisypigeon/pigeon/pull/1)) · a\n- ci: second ([#2](https://github.com/noisypigeon/pigeon/pull/2))\n- refactor: rename (!7) ([0123456](https://github.com/noisypigeon/pigeon/commit/0123456789abcdef0123456789abcdef01234567)) · a, b\n- units renamed · c → b\n\n## 2026-01-02\n\n### Merged\n\n- docs(adr): bootstrap ([0123456](https://github.com/noisypigeon/pigeon/commit/0123456789abcdef0123456789abcdef01234567))\n" }
    - files: {}
