description: A change never authorized, idle a day, whose session holds no live ticket, is evicted; see .claude/decisions/2026-11-10-development-change-slot-eviction-policy.md §3.
target: eviction
rules:
  - field: { name: state, equals: proposed }
  - field: { name: session_live, equals: false }
  - field: { name: idle, at_least: 86400 }
  - field: { name: pinned, equals: false }
  - field: { name: approval_open, equals: false }
  - field: { name: queued, equals: false }
