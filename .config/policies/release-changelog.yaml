description: Generated release changelogs have one section per version, newest first.
target:
  files:
    - src/pigeon-cli/crates/sentinel/CHANGELOG.md
    - src/pigeon-cli/crates/gantry/CHANGELOG.md
    - src/pigeon-cli/crates/cobot/CHANGELOG.md
    - src/pigeon-cli/crates/backplane/CHANGELOG.md
    - catalog/cloudflare/modules/zone/CHANGELOG.md
    - catalog/cloudflare/modules/permission-groups/CHANGELOG.md
    - catalog/cloudflare/modules/api-token/CHANGELOG.md
    - catalog/cloudflare/CHANGELOG.md
    - catalog/cloudflare/modules/dns-record/CHANGELOG.md
    - catalog/cloudflare/modules/r2-bucket/CHANGELOG.md
    - catalog/cloudflare/modules/r2-custom-domain/CHANGELOG.md
    - catalog/cloudflare/modules/ruleset/CHANGELOG.md
    - catalog/cloudflare/modules/account/CHANGELOG.md
    - catalog/cloudflare/modules/d1-database/CHANGELOG.md
    - catalog/cloudflare/modules/queue/CHANGELOG.md
    - catalog/cloudflare/modules/access-application/CHANGELOG.md
    - catalog/cloudflare/modules/access-policy/CHANGELOG.md
    - catalog/cloudflare/modules/access-service-token/CHANGELOG.md
    - catalog/agnostic/modules/random-string/CHANGELOG.md
    - catalog/agnostic/CHANGELOG.md
    - catalog/digitalocean/modules/project-resources/CHANGELOG.md
    - catalog/digitalocean/modules/project/CHANGELOG.md
    - catalog/digitalocean/modules/spaces-bucket/CHANGELOG.md
    - catalog/digitalocean/modules/ssh-key/CHANGELOG.md
    - catalog/digitalocean/CHANGELOG.md
    - catalog/scaleway/modules/iam-application/CHANGELOG.md
    - catalog/scaleway/modules/iam-policy/CHANGELOG.md
    - catalog/scaleway/modules/project/CHANGELOG.md
    - catalog/scaleway/CHANGELOG.md
    - catalog/backblaze/modules/bucket/CHANGELOG.md
    - catalog/backblaze/CHANGELOG.md
    - infra/pigeon/CHANGELOG.md
    - src/site-templates/architecture/CHANGELOG.md
    - src/site-templates/blog/CHANGELOG.md
  optional: true
rules:
  - line:
      at: 1
      matches: '^# Changelog$'
  - headings:
      level: 2
      each: '^v(?<v>[0-9]+\.[0-9]+\.[0-9]+) \((?<day>[0-9]{4}-[0-9]{2}-[0-9]{2})\)$'
      min: 1
      order: { by: day, direction: descending }
      unique: v
  - items:
      under: { level: 2 }
      lines: true
      matches: '^- .*\S \((?:\[#(?<pr>[0-9]+)\]\(https://github\.com/noisypigeon/pigeon/pull/(?<pr_url>[0-9]+)\)|\[(?<sha>[0-9a-f]{7,40})\]\(https://github\.com/noisypigeon/pigeon/commit/(?<sha_url>[0-9a-f]{40})\))\)$'
      min: 1
      elsewhere: forbid
      equal: [pr, pr_url]
      prefix: [sha, sha_url]
