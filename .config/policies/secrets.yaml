description: No new repository secrets; each secrets.config.yaml keeps exactly its keys, per 2026-11-04-development-platform-instance-separation.md.
target: tree
rules:
  - find:
      match: '(^|/)secrets\.config\.yaml$'
      allow_under:
        - infra/cloudflare/secrets.config.yaml
        - workloads/noisypigeon.com/apex/secrets.config.yaml
