description: infra/cloudflare keeps exactly its two encrypted secrets, per 2026-11-04-development-platform-instance-separation.md.
target: { file: infra/cloudflare/secrets.config.yaml }
rules:
  - fields:
      after: 0
      pattern: '^(?<key>[a-z0-9_]+): (?<value>.*)$'
      only: true
      expect:
        - { key: account_id, nonempty: true }
        - { key: provisioner_token, nonempty: true }
  - line: { at: 1, matches: '^[a-z0-9_]+: ENC\[cobot:v1:[A-Za-z0-9+/=]+\]$' }
  - line: { at: 2, matches: '^[a-z0-9_]+: ENC\[cobot:v1:[A-Za-z0-9+/=]+\]$' }
