description: The repository root holds only the agreed areas, and src/ only projects; backplane's core does no I/O, reads no clock and takes no `&mut self`, per 2026-11-10-development-factory-crates-functional-core.md §3.
target: tree
rules:
  - entries:
      path: .
      dirs: ['^\.claude$', '^\.config$', '^\.github$', '^src$', '^tooling$', '^catalog$', '^infra$', '^workloads$']
      files: ['^\.gitignore$', '^\.mcp\.json$', '^CHANGELOG\.md$', '^CLAUDE\.md$', '^config\.yaml$', '^mise\.toml$']
      require: [src, tooling, catalog, infra, workloads]
      ignore: ['^\.git$', '^\.cobot$']
  - entries:
      path: src
      dirs: ['^[a-z0-9]+(-[a-z0-9]+)*$']
      require: [pigeon-cli]
  - entries: { path: tooling, dirs: ['.'], files: ['.'], require: [README.md] }
  - entries: { path: catalog, dirs: ['^[a-z0-9]+(-[a-z0-9]+)*$'], files: ['^README\.md$'], require: [README.md] }
  - entries: { path: infra, dirs: ['.'], files: ['.'], require: [README.md] }
  - entries:
      path: workloads
      dirs: ['^[a-z0-9-]+(\.[a-z0-9-]+)+$']
      files: ['^README\.md$']
      require: [README.md]
  - find:
      match: '^src/pigeon-cli/crates/backplane/src/core/(change|approval|deploy|platform)/'
      forbid_content: 'std::fs|std::process|std::net|ureq|worker::|SystemTime::now|Instant::now|&mut self\b'
