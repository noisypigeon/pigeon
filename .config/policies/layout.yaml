description: The repository root holds only the agreed areas, and src/ only projects; pigeon-core does no I/O, reads no clock and takes no `&mut self`, per 2026-11-10-development-factory-crates-functional-core.md §3.
target: tree
rules:
  - entries:
      path: .
      dirs: ['^\.claude$', '^\.config$', '^\.github$', '^src$', '^tooling$', '^catalog$', '^infra$', '^workloads$']
      files: ['^\.gitignore$', '^\.mcp\.json$', '^CHANGELOG\.md$', '^CLAUDE\.md$', '^config\.yaml$', '^Cargo\.(toml|lock)$', '^Dockerfile$', '^\.dockerignore$', '^pigeon-start$', '^rust-toolchain\.toml$']
      require: [src, tooling, catalog, infra, workloads]
      ignore: ['^\.git$', '^\.pigeon$', '^target$']
  - entries:
      path: src
      dirs: ['^[a-z0-9]+(-[a-z0-9]+)*$']
  - entries: { path: tooling, dirs: ['.'], files: ['.'], require: [README.md] }
  - entries: { path: catalog, dirs: ['^[a-z0-9]+(-[a-z0-9]+)*$'], files: ['^README\.md$'], require: [README.md] }
  - entries: { path: infra, dirs: ['.'], files: ['.'], require: [README.md] }
  - entries:
      path: workloads
      dirs: ['^[a-z0-9-]+(\.[a-z0-9-]+)+$']
      files: ['^README\.md$']
      require: [README.md]
  - find:
      match: '^src/pigeon-core/src/(change|approval|deploy|platform|infra|sites|release)/'
      forbid_content: 'std::fs|std::process|std::net|ureq|worker::|SystemTime::now|Instant::now|&mut self\b'
examples:
  pass:
    - files: { CHANGELOG.md: "", CLAUDE.md: "", .gitignore: "", src/pigeon-core/Cargo.toml: "", tooling/README.md: "", catalog/README.md: "", infra/README.md: "", workloads/README.md: "" }
    - files: { CHANGELOG.md: "", CLAUDE.md: "", .gitignore: "", src/pigeon-core/Cargo.toml: "", tooling/README.md: "", catalog/README.md: "", infra/README.md: "", workloads/README.md: "", tooling/garden/x: "", infra/notes.md: "", src/second-project/Cargo.toml: "", workloads/noisypigeon.com/x: "", catalog/cloudflare/x: "" }
    - files: { CHANGELOG.md: "", CLAUDE.md: "", .gitignore: "", src/pigeon-core/Cargo.toml: "", tooling/README.md: "", catalog/README.md: "", infra/README.md: "", workloads/README.md: "", src/pigeon-core/src/change/lifecycle.rs: "pub fn step(c: &Change) -> Change {\n    c.clone()\n}\n" }
    - files: { CHANGELOG.md: "", CLAUDE.md: "", .gitignore: "", src/pigeon-core/Cargo.toml: "", tooling/README.md: "", catalog/README.md: "", infra/README.md: "", workloads/README.md: "", src/pigeon-core/src/change/lifecycle.rs: "fn pushed(mut self) -> Self {\n    self\n}\n" }
    - files: { CHANGELOG.md: "", CLAUDE.md: "", .gitignore: "", src/pigeon-core/Cargo.toml: "", tooling/README.md: "", catalog/README.md: "", infra/README.md: "", workloads/README.md: "", src/pigeon-agent/src/worker/change.rs: "fn apply(&mut self) { std::fs::read(p); }" }
  fail:
    - files: { CHANGELOG.md: "", CLAUDE.md: "", .gitignore: "", src/pigeon-core/Cargo.toml: "", tooling/README.md: "", catalog/README.md: "", infra/README.md: "", workloads/README.md: "", stray/x: "" }
    - files: { CHANGELOG.md: "", CLAUDE.md: "", .gitignore: "", src/pigeon-core/Cargo.toml: "", tooling/README.md: "", catalog/README.md: "", infra/README.md: "", workloads/README.md: "", stray.txt: "" }
    - files: { CHANGELOG.md: "", CLAUDE.md: "", .gitignore: "", src/pigeon-core/Cargo.toml: "", tooling/README.md: "", catalog/README.md: "", infra/README.md: "" }
