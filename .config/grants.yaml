# Grants: each secret the control plane mints, generates or derives, by name, and where it is
# put; never a value. See .claude/decisions/2026-11-12-development-grants-applies-rescue-yield.md §1.
grants:
  observability:
    mint: { capabilities: [observability.read, analytics.read], ttl: 90d, rotate: 30d }
    route: { worker: pigeon-control, key: OBSERVABILITY_TOKEN }
  # The AI Gateway Run token, minted by the Pool object at run time and held in its memory only;
  # see .claude/decisions/2026-11-16-security-ai-gateway-claude-api.md, the Run token amendment.
  aigateway:
    mint: { capabilities: [aigateway.run], ttl: 1h }
    route: { object: Pool }
  # A platform run's account token: its unit's capabilities, minted on the plan's passkey proof
  # and sealed for the run; see .claude/decisions/2026-11-17-security-platform-run-minted-token.md §3.
  platform-run:
    mint: { capabilities: from-unit, ttl: 24h }
    route: { job: platform.plan }
