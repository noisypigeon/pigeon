description: Release units and the one changelog; only the release bot writes versions and CHANGELOG.md.
repository: https://github.com/noisypigeon/pigeon
changelog: CHANGELOG.md
units:
  # Its own crate alone; see .claude/decisions/2026-11-10-development-factory-crates-functional-core.md §1.
  pigeon-eviction:
    previous: sentinel
    manifest: src/pigeon-eviction/Cargo.toml
    features: ""
    image: ghcr.io/noisypigeon/pigeon-eviction
    paths:
      - src/pigeon-eviction/
      - Dockerfile
      - .dockerignore
    exclude: [tests/, benches/, '*.md']
    cargo: { workspace: ., package: pigeon-eviction }
  backplane:
    manifest: src/pigeon-cli/crates/backplane/Cargo.toml
    features: backplane
    image: ghcr.io/noisypigeon/pigeon-backplane
    paths:
      - src/pigeon-cli/crates/backplane/
      - src/pigeon-harness/src/commands/backplane.rs
      - src/pigeon-harness/src/cli/backplane.rs
      - src/pigeon-harness/src/commands/cobot.rs
      - src/pigeon-harness/src/cli/cobot.rs
      - src/pigeon-harness/src/commands/workers.rs
      - src/pigeon-harness/src/main.rs
      - src/pigeon-harness/src/lib.rs
      - src/pigeon-harness/src/cli/mod.rs
      - src/pigeon-harness/src/commands/mod.rs
      - src/pigeon-harness/Cargo.toml
      - Dockerfile
      - .dockerignore
    exclude: [tests/, benches/, '*.md']
    cargo: { workspace: ., package: pigeon }
  infra-cloudflare-zone:
    manifest: catalog/cloudflare/modules/zone/module.yaml
    paths: [catalog/cloudflare/modules/zone/]
    exclude: ['*.md']
  infra-cloudflare-permission-groups:
    manifest: catalog/cloudflare/modules/permission-groups/module.yaml
    paths: [catalog/cloudflare/modules/permission-groups/]
    exclude: ['*.md']
  infra-cloudflare-api-token:
    manifest: catalog/cloudflare/modules/api-token/module.yaml
    paths: [catalog/cloudflare/modules/api-token/]
    exclude: ['*.md']
  infra-cloudflare-schema:
    manifest: catalog/cloudflare/schema.json
    paths: [catalog/cloudflare/schema.json, catalog/cloudflare/capabilities.yaml, catalog/cloudflare/modules/, catalog/cloudflare/presets/]
    exclude: ['*.md']
  infra-cloudflare-dns-record:
    manifest: catalog/cloudflare/modules/dns-record/module.yaml
    paths: [catalog/cloudflare/modules/dns-record/]
    exclude: ['*.md']
  infra-cloudflare-r2-bucket:
    manifest: catalog/cloudflare/modules/r2-bucket/module.yaml
    paths: [catalog/cloudflare/modules/r2-bucket/]
    exclude: ['*.md']
  infra-cloudflare-r2-custom-domain:
    manifest: catalog/cloudflare/modules/r2-custom-domain/module.yaml
    paths: [catalog/cloudflare/modules/r2-custom-domain/]
    exclude: ['*.md']
  infra-cloudflare-account:
    manifest: catalog/cloudflare/modules/account/module.yaml
    paths: [catalog/cloudflare/modules/account/]
    exclude: ['*.md']
  infra-cloudflare-d1-database:
    manifest: catalog/cloudflare/modules/d1-database/module.yaml
    paths: [catalog/cloudflare/modules/d1-database/]
    exclude: ['*.md']
  infra-cloudflare-queue:
    manifest: catalog/cloudflare/modules/queue/module.yaml
    paths: [catalog/cloudflare/modules/queue/]
    exclude: ['*.md']
  infra-cloudflare-secrets-store:
    manifest: catalog/cloudflare/modules/secrets-store/module.yaml
    paths: [catalog/cloudflare/modules/secrets-store/]
    exclude: ['*.md']
  infra-cloudflare-access-application:
    manifest: catalog/cloudflare/modules/access-application/module.yaml
    paths: [catalog/cloudflare/modules/access-application/]
    exclude: ['*.md']
  infra-cloudflare-access-policy:
    manifest: catalog/cloudflare/modules/access-policy/module.yaml
    paths: [catalog/cloudflare/modules/access-policy/]
    exclude: ['*.md']
  infra-cloudflare-access-service-token:
