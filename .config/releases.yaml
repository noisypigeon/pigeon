description: Release units and changelog tiers; only the release bot writes versions and changelogs.
repository: https://github.com/noisypigeon/pigeon
units:
  sentinel:
    manifest: src/pigeon-cli/crates/sentinel/Cargo.toml
    features: sentinel
    image: ghcr.io/noisypigeon/pigeon-sentinel
    paths:
      - src/pigeon-cli/crates/sentinel/
      - src/pigeon-cli/crates/pigeon/src/commands/sentinel.rs
      - src/pigeon-cli/crates/pigeon/src/cli/sentinel.rs
      - src/pigeon-cli/crates/pigeon/src/main.rs
      - src/pigeon-cli/crates/pigeon/src/lib.rs
      - src/pigeon-cli/crates/pigeon/src/cli/mod.rs
      - src/pigeon-cli/crates/pigeon/src/commands/mod.rs
      - src/pigeon-cli/crates/pigeon/Cargo.toml
      - src/pigeon-cli/Dockerfile
      - src/pigeon-cli/.dockerignore
    exclude: [tests/, benches/, '*.md']
    cargo: { workspace: src/pigeon-cli, package: pigeon }
  gantry:
    manifest: src/pigeon-cli/crates/gantry/Cargo.toml
    features: gantry
    image: ghcr.io/noisypigeon/pigeon-gantry
    paths:
      - src/pigeon-cli/crates/gantry/
      - src/pigeon-cli/crates/pigeon/src/commands/gantry.rs
      - src/pigeon-cli/crates/pigeon/src/main.rs
      - src/pigeon-cli/crates/pigeon/src/lib.rs
      - src/pigeon-cli/crates/pigeon/src/cli/mod.rs
      - src/pigeon-cli/crates/pigeon/src/commands/mod.rs
      - src/pigeon-cli/crates/pigeon/Cargo.toml
      - src/pigeon-cli/Dockerfile
      - src/pigeon-cli/.dockerignore
    exclude: [tests/, benches/, '*.md']
    cargo: { workspace: src/pigeon-cli, package: pigeon }
  cobot:
    manifest: src/pigeon-cli/crates/cobot/Cargo.toml
    features: cobot
    image: ghcr.io/noisypigeon/pigeon-cobot
    paths:
      - src/pigeon-cli/crates/cobot/
      - src/pigeon-cli/crates/pigeon/src/commands/cobot.rs
      - src/pigeon-cli/crates/pigeon/src/cli/cobot.rs
      - src/pigeon-cli/crates/pigeon/src/main.rs
      - src/pigeon-cli/crates/pigeon/src/lib.rs
      - src/pigeon-cli/crates/pigeon/src/cli/mod.rs
      - src/pigeon-cli/crates/pigeon/src/commands/mod.rs
      - src/pigeon-cli/crates/pigeon/Cargo.toml
      - src/pigeon-cli/Dockerfile
      - src/pigeon-cli/.dockerignore
    exclude: [tests/, benches/, '*.md']
    cargo: { workspace: src/pigeon-cli, package: pigeon }
  backplane:
    manifest: src/pigeon-cli/crates/backplane/Cargo.toml
    features: backplane
    image: ghcr.io/noisypigeon/pigeon-backplane
    paths:
      - src/pigeon-cli/crates/backplane/
      - src/pigeon-cli/crates/pigeon/src/commands/backplane.rs
      - src/pigeon-cli/crates/pigeon/src/cli/backplane.rs
      - src/pigeon-cli/crates/pigeon/src/main.rs
      - src/pigeon-cli/crates/pigeon/src/lib.rs
      - src/pigeon-cli/crates/pigeon/src/cli/mod.rs
      - src/pigeon-cli/crates/pigeon/src/commands/mod.rs
      - src/pigeon-cli/crates/pigeon/Cargo.toml
      - src/pigeon-cli/Dockerfile
      - src/pigeon-cli/.dockerignore
    exclude: [tests/, benches/, '*.md']
    cargo: { workspace: src/pigeon-cli, package: pigeon }
  infra-cloudflare-zone:
    manifest: catalog/cloudflare/modules/zone/module.yaml
    paths: [catalog/cloudflare/modules/zone/]
    exclude: ['*.md']
  infra-cloudflare-permission-groups:
    manifest: catalog/cloudflare/modules/permission-groups/module.yaml
    paths: [catalog/cloudflare/modules/permission-groups/]
    exclude: ['*.md']
  infra-cloudflare-api-token:
    manifest: catalog/cloudflare/modules/api-token/module.yaml
    paths: [catalog/cloudflare/modules/api-token/]
    exclude: ['*.md']
  infra-cloudflare-schema:
    manifest: catalog/cloudflare/schema.json
    paths: [catalog/cloudflare/schema.json, catalog/cloudflare/modules/, catalog/cloudflare/presets/]
    exclude: ['*.md']
  infra-cloudflare-dns-record:
    manifest: catalog/cloudflare/modules/dns-record/module.yaml
    paths: [catalog/cloudflare/modules/dns-record/]
    exclude: ['*.md']
  infra-cloudflare-r2-bucket:
    manifest: catalog/cloudflare/modules/r2-bucket/module.yaml
    paths: [catalog/cloudflare/modules/r2-bucket/]
    exclude: ['*.md']
  infra-cloudflare-r2-custom-domain:
    manifest: catalog/cloudflare/modules/r2-custom-domain/module.yaml
    paths: [catalog/cloudflare/modules/r2-custom-domain/]
    exclude: ['*.md']
  infra-cloudflare-ruleset:
    manifest: catalog/cloudflare/modules/ruleset/module.yaml
    paths: [catalog/cloudflare/modules/ruleset/]
    exclude: ['*.md']
  infra-agnostic-random-string:
    manifest: catalog/agnostic/modules/random-string/module.yaml
    paths: [catalog/agnostic/modules/random-string/]
    exclude: ['*.md']
  infra-agnostic-schema:
    manifest: catalog/agnostic/schema.json
    paths: [catalog/agnostic/schema.json, catalog/agnostic/modules/]
    exclude: ['*.md']
  static-site-template:
    manifest: src/static-site-template/template.yaml
    paths: [src/static-site-template/]
    exclude: ['*.md']
settings:
  - { file: src/pigeon-cli/Cargo.toml, tables: '^\[profile\.', keys: '^(edition|rust-version)\s*=' }
  - { file: mise.toml, keys: '^rust\s*=' }
tiers:
  - { file: CHANGELOG.md, paths: [''] }
  - { file: src/pigeon-cli/CHANGELOG.md, paths: [src/pigeon-cli/] }
  - { file: src/pigeon-cli/crates/pigeon/CHANGELOG.md, paths: [src/pigeon-cli/crates/pigeon/] }
  - { file: src/pigeon-cli/crates/sentinel/CHANGELOG.md, unit: sentinel }
  - { file: src/pigeon-cli/crates/gantry/CHANGELOG.md, unit: gantry }
  - { file: src/pigeon-cli/crates/cobot/CHANGELOG.md, unit: cobot }
  - { file: src/pigeon-cli/crates/backplane/CHANGELOG.md, unit: backplane }
  - { file: catalog/cloudflare/modules/zone/CHANGELOG.md, unit: infra-cloudflare-zone, from: infra/cloudflare/modules/zone/CHANGELOG.md }
  - { file: catalog/cloudflare/modules/permission-groups/CHANGELOG.md, unit: infra-cloudflare-permission-groups, from: infra/cloudflare/modules/permission-groups/CHANGELOG.md }
  - { file: catalog/cloudflare/modules/api-token/CHANGELOG.md, unit: infra-cloudflare-api-token, from: infra/cloudflare/modules/api-token/CHANGELOG.md }
  - { file: catalog/cloudflare/CHANGELOG.md, unit: infra-cloudflare-schema, from: infra/cloudflare/CHANGELOG.md }
  - { file: catalog/cloudflare/modules/dns-record/CHANGELOG.md, unit: infra-cloudflare-dns-record, from: infra/cloudflare/modules/dns-record/CHANGELOG.md }
  - { file: catalog/cloudflare/modules/r2-bucket/CHANGELOG.md, unit: infra-cloudflare-r2-bucket, from: infra/cloudflare/modules/r2-bucket/CHANGELOG.md }
  - { file: catalog/cloudflare/modules/r2-custom-domain/CHANGELOG.md, unit: infra-cloudflare-r2-custom-domain, from: infra/cloudflare/modules/r2-custom-domain/CHANGELOG.md }
  - { file: catalog/cloudflare/modules/ruleset/CHANGELOG.md, unit: infra-cloudflare-ruleset, from: infra/cloudflare/modules/ruleset/CHANGELOG.md }
  - { file: catalog/agnostic/modules/random-string/CHANGELOG.md, unit: infra-agnostic-random-string, from: infra/agnostic/modules/random-string/CHANGELOG.md }
  - { file: catalog/agnostic/CHANGELOG.md, unit: infra-agnostic-schema, from: infra/agnostic/CHANGELOG.md }
  - { file: src/static-site-template/CHANGELOG.md, unit: static-site-template }
