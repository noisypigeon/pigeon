    exclude: ['*.md']
  infra-backblaze-schema:
    manifest: catalog/backblaze/schema.json
    paths: [catalog/backblaze/schema.json, catalog/backblaze/capabilities.yaml, catalog/backblaze/modules/, catalog/agnostic/modules/random-string/]
    exclude: ['*.md']
  infra-pigeon-schema:
    manifest: infra/pigeon/schema.json
    paths: [infra/pigeon/schema.json, catalog/cloudflare/modules/account/, catalog/cloudflare/modules/d1-database/, catalog/cloudflare/modules/r2-bucket/, catalog/agnostic/modules/random-string/]
    exclude: ['*.md']
  site-template-architecture:
    manifest: src/pigeon-site-templates/architecture/template.yaml
    paths: [src/pigeon-site-templates/architecture/]
    exclude: ['*.md']
  site-template-blog:
    manifest: src/pigeon-site-templates/blog/template.yaml
    paths: [src/pigeon-site-templates/blog/]
    exclude: ['*.md']
settings:
  - { file: Cargo.toml, tables: '^\[profile\.', keys: '^(edition|rust-version)\s*=' }
  - { file: rust-toolchain.toml, keys: '^(channel|components|targets)\s*=' }
