# Approval tiers; read from main by the bound job. See
# .claude/decisions/2026-11-08-security-tiered-approvals-task-mandates.md.
# Always the authenticator code, and never in a mandate.
guarded:
  - .config/approvals.yaml
  - .config/policies/**
  - "**/secrets.config.yaml"
  - .mcp.json
  - .claude/settings*.json
  # The code checks' workflow; see .claude/decisions/2026-11-10-development-code-checks-github-actions.md §6.
  - .github/**
  - src/pigeon-cli/crates/backplane/src/approvals.rs
  - src/pigeon-cli/crates/backplane/src/approve.rs
  - src/pigeon-cli/crates/backplane/src/worker/approve.rs
  - src/pigeon-cli/crates/backplane/src/mandates.rs
  - src/pigeon-cli/crates/backplane/src/worker/mandates.rs
  - src/pigeon-cli/crates/backplane/src/access.rs
  - src/pigeon-cli/crates/backplane/src/grants.rs
  - src/pigeon-cli/crates/backplane/src/totp.rs
  - src/pigeon-cli/crates/backplane/src/worker/elicit.rs
  - src/pigeon-cli/crates/backplane/src/passkeys.rs
  - src/pigeon-cli/crates/backplane/src/worker/passkeys.rs
  - src/pigeon-cli/crates/backplane/src/worker/passkey.js
# The code without a mandate that may deploy; every Worker's inputs count too.
deploying:
  - infra/**
  - src/pigeon-cli/Dockerfile
  - src/pigeon-cli/pigeon-start
  - "**/migrations/**"
spikes:
  - tooling/spikes/**
decisions: .claude/decisions/
# Changes that add, read or expose a secret: the owner, each time. See
# .claude/decisions/2026-11-09-security-approvals-once-passkeys.md §2.
secrets:
  - .config/approvals.yaml
  - "**/secrets.config.yaml"
  - .mcp.json
  - .claude/settings*.json
  - catalog/cloudflare/capabilities.yaml
  - catalog/cloudflare/modules/api-token/**
  - catalog/cloudflare/modules/access-service-token/**
  - src/pigeon-cli/crates/backplane/src/worker/platform.rs
  - src/pigeon-cli/crates/backplane/src/platform_job.rs
# Files whose `secrets:` list a head may not lengthen without the owner.
secret_lists:
  - "**/worker.yaml"
# Sentinel's paths: the judge and its rules. A change touching them is its own grant: code (the
# owner for this file), never a mandate, and nothing in it but these and its ADR. See
# .claude/decisions/2026-11-10-development-factory-crates-functional-core.md §2.
sentinel:
  - src/pigeon-cli/crates/sentinel/**
  - .config/policies/**
  - catalog/policies/**
  - .config/approvals.yaml
