# Approval tiers; read from main by the bound job. See
# .claude/decisions/2026-11-08-security-tiered-approvals-task-mandates.md.
# Always the authenticator code, and never in a mandate.
guarded:
  - .config/approvals.yaml
  - .config/policies/**
  - "**/secrets.config.yaml"
  - .mcp.json
  - .claude/settings*.json
  # The code checks' workflow; see .claude/decisions/2026-11-10-development-code-checks-github-actions.md §6.
  - .github/**
  - src/pigeon-core/src/approve.rs
  - src/pigeon-core/src/access.rs
  - src/pigeon-agent/src/worker/approve.rs
  - src/pigeon-agent/src/worker/mandates.rs
  - src/pigeon-agent/src/worker/elicit.rs
  - src/pigeon-agent/src/worker/passkeys.rs
  - src/pigeon-agent/src/worker/passkey.js
  # The approval domain's core; see .claude/decisions/2026-11-10-development-factory-crates-functional-core.md §3.
  - src/pigeon-core/src/approval/**
  # Each role's capabilities; see .claude/decisions/2026-11-14-security-instance-members-roles-invitations.md §2.
  - .config/roles.yaml
  # The provider registry and the broker's verdict; see .claude/decisions/2026-11-16-security-provider-calls-mcp-broker.md §3.
  - .config/providers/**
  - src/pigeon-core/src/provider/**
  # The pools' spend caps; see .claude/decisions/2026-11-15-development-capacity-pools-hard-spend-cap.md, 2026-11-17 amendments.
  - .config/pool.yaml
# The gate: the guarded paths Auto never covers, the code that sets the owner tier and proves
# the owner; Auto covers every other guarded and eviction path. See
# .claude/decisions/2026-11-15-security-standing-auto-owner-flags.md's 2026-11-16 amendments.
gate:
  - .config/approvals.yaml
  - .config/policies/secrets*.yaml
  - .github/**
  - src/pigeon-core/src/approval/**
  - src/pigeon-core/src/approve.rs
  - src/pigeon-core/src/access.rs
  - src/pigeon-agent/src/worker/approve.rs
  - src/pigeon-agent/src/worker/elicit.rs
  - src/pigeon-agent/src/worker/mandates.rs
  - src/pigeon-agent/src/worker/passkeys.rs
  - src/pigeon-agent/src/worker/passkey.js
  # The credential plane: grant redemption, minting, the grants ledger and app devices.
  - .config/grants.yaml
  - src/pigeon-core/src/minting.rs
  - src/pigeon-core/src/ledger.rs
  - src/pigeon-core/src/app/devices.rs
  - src/pigeon-agent/src/worker/change.rs
  - src/pigeon-agent/src/worker/minting.rs
  - src/pigeon-agent/src/worker/devices.rs
  # The pools' spend caps: a passkey each time, Auto or not.
  - .config/pool.yaml
# The code without a mandate that may deploy; every Worker's inputs count too.
deploying:
  - infra/**
  - Dockerfile
  - pigeon-start
  - "**/migrations/**"
spikes:
  - tooling/spikes/**
decisions: .claude/decisions/
# Changes that add, read or expose a secret: the owner, each time. See
# .claude/decisions/2026-11-09-security-approvals-once-passkeys.md §2.
secrets:
  - .config/approvals.yaml
  - "**/secrets.config.yaml"
  - .mcp.json
  - .claude/settings*.json
  - catalog/cloudflare/capabilities.yaml
  - catalog/cloudflare/modules/api-token/**
  - catalog/cloudflare/modules/access-service-token/**
  # What each role may do; see .claude/decisions/2026-11-14-security-instance-members-roles-invitations.md §2.
  - .config/roles.yaml
# Code that reads a secret but holds none: the owner's only when a diff line holds a marker. See
# .claude/decisions/2026-11-17-security-auto-covers-routine-owner-asks.md §3.
secret_code:
  # The Apple connection and the code that handles the signing identity; see
  # .claude/decisions/2026-11-11-release-ios-app-buildkite-testflight.md §7.
  - src/pigeon-agent/src/worker/platform.rs
  - src/pigeon-agent/src/platform_job.rs
  - src/pigeon-core/src/apple.rs
  - src/pigeon-agent/src/worker/apple.rs
  - src/pigeon-core/src/signing.rs
  - src/pigeon-harness/src/commands/signing.rs
  - tooling/ci/buildkite/ios-sign.sh
  # The broker reads a provider credential per call; see
  # .claude/decisions/2026-11-16-security-provider-calls-mcp-broker.md §4.
  - src/pigeon-agent/src/worker/provider.rs
secret_markers:
  - secret
  - token
  - passphrase
  - password
  - private_key
  - credential
  - mint
  - grant
  - authorization
  - bearer
  - signing
  - p12
  - keychain
# Files whose `secrets:` list a head may not lengthen without the owner.
secret_lists:
  - "**/worker.yaml"
# The judge's paths (pigeon-eviction) and its rules. A change touching them is its own grant:
# code (the owner for this file), never a mandate, and nothing in it but these and its ADR. See
# .claude/decisions/2026-11-10-development-factory-crates-functional-core.md §2.
eviction:
  - src/pigeon-eviction/**
  - .config/policies/**
  - catalog/policies/**
  - .config/approvals.yaml
# Workspace bookkeeping a judge change may also carry, as its crate moves or is renamed; see
# the same ADR's 2026-11-16 amendment.
eviction_bookkeeping:
  - Cargo.toml
  - Cargo.lock
  - tooling/ci/tests.ledger
  - tooling/ci/tests.moves
  # The provider-call policies' list; see the MCP broker ADR's 2026-11-17 amendment.
  - src/pigeon-core/src/provider/policy.rs
  - .config/releases.yaml
